name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/backend-go

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache-dependency-path: web/backend-go/go.mod

      - name: Run tests
        run: go test -v ./...
