name: C/C++ CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Provide precompiled Dummy player object (Linux)
      run: cp AIDummy.o.Linux64 AIDummy.o
    - name: make
      run: make
